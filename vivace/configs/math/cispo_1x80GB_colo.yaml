# CISPO math 1.5B colocated, single 80GB GPU (A100 / H100 / H200).
# Baseline for the 1 → 2 → 4 → 8 GPU scaling study. All four configs
# (1x/2x/4x/8x) keep per-rank work IDENTICAL so we measure pure scaling:
# per-rank batch_size=4, group_size=8, grad_accum_steps=2 → 64 trajectories
# per rank per optimizer step. Global trajectories = N_ranks × 64.
#
# Trainer + vLLM share each GPU via vLLM sleep/wake. gpu_memory_utilization
# is bumped from the disaggregated 0.8 down to 0.35 to leave room for the
# trainer's activations + Adam state on the same card. On 80GB:
#   vLLM = 0.35 × 80 = 28 GB (weights ~3 GB + KV ~20 GB at vllm_max_num_seqs=128)
#   Trainer = ~25 GB (1.5B model + LoRA + Adam + activations at micro-bs 32)
# Leaves ~25 GB headroom on each card.
#
# Recipe (loss / lr / kl / clipping) matches the validated math winner from
# 2x4090 (math/cispo_2x4090.yaml) so results are comparable to that baseline.
# Launch with: torchrun --nproc_per_node=1 -m vivace.scripts.train ...
model_name: Qwen/Qwen2.5-1.5B
env_name: math
eval_envs:
- gsm8k
- math500
algo_name: cispo
mode: colocated
trainer_gpus:
- 0
rollout_gpus:
- 0
use_vllm: true
gpu_memory_utilization: 0.35
enforce_eager: false
compile_model: false
vllm_max_model_len: 1280
vllm_max_num_seqs: 128
use_lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
num_steps: 500
sft_warmup: false
sft_warmup_steps: 0
wandb_project: vivace
log_interval: 1
eval_interval: 50
eval_n: -1
eval_batch_size: 128
eval_use_vllm: true
max_prompt_tokens: 512
checkpoint_interval: 100
run_dir: runs/cispo_math_qw25_1.5b_lora_vllm_1x80GB_colo
weight_sync_method: ipc
seed: 42
rl:
  loss_type: cispo
  adv_type: rloo
  batch_size: 4
  group_size: 8
  lr: 2.0e-05
  warmup_steps: 10
  grad_accum_steps: 2
  optim_epochs: 2
  eta_min_ratio: 0.2
  lr_restart: false
  grad_clip: 1.0
  max_new_tokens: 768
  temperature: 0.7
  top_p: 0.95
  top_k: -1
  clip_low: 0.2
  clip_high: 0.2
  clip_ratio: 0.25
  clip_cispo_high: 5.0
  clip_cispo_low: 0.0
  kl_coef: 0.01
  adv_eps: 0.0001
  dg_eta: 1.0
  entropy_chunk_size: 64
  entropy_grad: false
  adaptive_sampling: true
  oversample_factor: 2.0
  min_reward_spread: 0.5
  use_adaptive_lr: false
  kl_target: 0.05
  kl_factor: 1.5
  kl_ema: 0.2
  lr_factor: 1.5
  min_lr: 1.0e-07
  max_lr: 2.0e-05
gradient_checkpointing: false
