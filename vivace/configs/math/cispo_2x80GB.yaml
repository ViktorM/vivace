# CISPO math 1.5B disagg, sized for 2× 80GB GPUs (A100 / H100 / H200).
# Works unchanged across all three SKUs — use A100 80GB for cheap validation
# ($1.49/hr × 2), then swap to H100 SXM for the real research runs.
#
# Same family as the 4090 math recipe (canonical clipped-IS CISPO, lr=2e-5,
# kl=0.01), but:
# - batch_size: 8 (was 1 on 4090) — 8 unique prompts per micro-batch for
#   diversity; gs=8 kept so per-prompt advantage variance matches the validated
#   baseline. gs=16 is an explicit ablation (docs/ablation_studies.md), not the
#   default.
# - grad_accum_steps: 1 (was 4 on 4090) — 80GB fits the whole step in one
#   microbatch. Validated 27 s/step on 2× A100 SXM at this setting.
# - Net: 8 × 8 × 1 = 64 trajectories per gradient step (2× the desktop's 32);
#   also the first cluster-scale test of the "small batch is the cause"
#   hypothesis for the step-200 collapse pattern.
# - gradient_checkpointing ON — bs=8 × max_new=1024 peaks ~78 GB on the trainer
#   GPU without it, no room for the SiLU forward spike; GC brings peak to ~52 GB
#   at ~30% slower steps. The only way bs=8 at max=1024 fits on 80GB.
# - gpu_memory_utilization: 0.80 — the rollout GPU is vLLM's alone: ~64 GB pool
#   (weights ~3 GB, rest KV). Colocated configs use 0.7 and rely on vLLM sleep.
# - vllm_max_num_seqs: 256 — rollout bursts (8×8×2.0 = 128 concurrent) and
#   full-set eval generation never serialize.
# - eval_batch_size: 128 — eval runs through vLLM; same headroom applies.
#
# Verify GPU memory utilization (runpod_quickstart.md, "Verify GPU memory
# utilization") and bump batch_size / group_size further if either GPU has
# significant headroom.
model_name: Qwen/Qwen2.5-1.5B
env_name: math
eval_envs:
- gsm8k
- math500
algo_name: cispo
mode: disaggregated
trainer_gpus:
- 0
rollout_gpus:
- 1
use_vllm: true
gpu_memory_utilization: 0.80
enforce_eager: false
compile_model: false
vllm_max_model_len: 1536   # >= max_prompt_tokens (512) + rl.max_new_tokens (1024): vLLM stops at max_model_len - prompt_len, finish_reason=length
vllm_max_num_seqs: 256   # Qwen2.5 KV is small; 128 (Qwen3.5-era cap) throttled eval + rollout concurrency
use_lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
num_steps: 200
sft_warmup: false
sft_warmup_steps: 0
wandb_project: vivace
log_interval: 1
eval_interval: 50
eval_n: -1
eval_batch_size: 128
eval_use_vllm: true
max_prompt_tokens: 512
checkpoint_interval: 100
run_dir: runs/cispo_math_qw25_1.5b_lora_vllm_2x80GB
weight_sync_method: nccl
seed: 42
rl:
  loss_type: cispo
  adv_type: rloo
  batch_size: 8
  group_size: 8
  lr: 2.0e-05
  warmup_steps: 10
  grad_accum_steps: 1
  optim_epochs: 2
  eta_min_ratio: 0.2
  lr_restart: false
  grad_clip: 1.0
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.95
  top_k: -1
  clip_low: 0.2
  clip_high: 0.2
  clip_ratio: 0.25
  clip_cispo_high: 5.0
  clip_cispo_low: 0.0
  cispo_use_token_mask: false
  cispo_normalization: hybrid
  kl_coef: 0.01
  adv_eps: 0.0001
  dg_eta: 1.0
  entropy_chunk_size: 64
  entropy_grad: false
  adaptive_sampling: true
  oversample_factor: 2.0
  min_reward_spread: 0.5
  use_adaptive_lr: false
  kl_target: 0.05
  kl_factor: 1.5
  kl_ema: 0.2
  lr_factor: 1.5
  min_lr: 1.0e-07
  max_lr: 2.0e-05
gradient_checkpointing: true
