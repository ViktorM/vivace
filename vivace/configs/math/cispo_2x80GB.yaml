# CISPO math 1.5B disagg, sized for 2× 80GB GPUs (A100 / H100 / H200).
# Works unchanged across all three SKUs — use A100 80GB for cheap validation
# ($1.49/hr × 2), then swap to H100 SXM for the real research runs.
#
# Same recipe as the canonical math winner (ep=4/mask/lr=2e-5/kl=0.01), but:
# - batch_size: 8 (was 1 on 4090) — 8 unique prompts per micro-batch.
#   Direct scale-up of the 4090's gs=8/bs=1 baseline, just wider. Keeps
#   the validated per-prompt advantage variance (gs=8) and trades more
#   prompts per step for diversity. gs=16 is an explicit ablation, not
#   the default (see docs/ablation_studies.md).
# - group_size: 8 (matches the 4090 baseline)
# - grad_accum_steps: 1 (was 4 on 4090) — 80GB fits the whole step in one
#   microbatch. Validated 27 s/step on 2× A100 SXM at this setting.
# - Net: 8 × 8 × 1 = 64 trajectories per gradient step (2× the desktop's 32).
#   This is also the first cluster-scale test of the "small batch is the cause"
#   hypothesis for the step-200 collapse pattern.
# - gradient_checkpointing ON — bs=8 × max_new=1024 hits ~78 GB peak on the
#   trainer GPU without checkpointing, leaving no room for the SiLU forward
#   spike. GC brings peak to ~52 GB. ~30% slower per step, but the only
#   way bs=8 at max=1024 fits on 80GB.
# - gpu_memory_utilization: 0.80 — disagg rollout GPU is dedicated to vLLM
#   (no trainer sharing), so vLLM gets ~64 GB of KV cache. Distinct from
#   the colocated config where 0.25 is right because the trainer needs the
#   rest of the card.
# - vllm_max_num_seqs: 128 — large enough to handle the rollout burst
#   (8 prompts × 8 group × oversample 2.0 = ≤128 concurrent sequences).
# - eval_batch_size: 128 — eval runs through vLLM; same headroom applies.
#
# Verify GPU memory utilization (see runpod_quickstart.md "Verify GPU
# memory utilization" section) and bump batch_size / group_size further
# if either GPU has significant headroom.
model_name: Qwen/Qwen2.5-1.5B
env_name: math
eval_envs:
- gsm8k
- math500
algo_name: cispo
mode: disaggregated
trainer_gpus:
- 0
rollout_gpus:
- 1
use_vllm: true
gpu_memory_utilization: 0.80
enforce_eager: false
compile_model: false
vllm_max_model_len: 1280
vllm_max_num_seqs: 128
use_lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
num_steps: 500
sft_warmup: false
sft_warmup_steps: 0
wandb_project: vivace
log_interval: 1
eval_interval: 50
eval_n: -1
eval_batch_size: 128
eval_use_vllm: true
max_prompt_tokens: 512
checkpoint_interval: 100
run_dir: runs/cispo_math_qw25_1.5b_lora_vllm_2x80GB
weight_sync_method: nccl
seed: 42
rl:
  loss_type: cispo
  adv_type: rloo
  batch_size: 8
  group_size: 8
  lr: 2.0e-05
  warmup_steps: 10
  grad_accum_steps: 1
  optim_epochs: 2
  eta_min_ratio: 0.2
  lr_restart: false
  grad_clip: 1.0
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.95
  top_k: -1
  clip_low: 0.2
  clip_high: 0.2
  clip_ratio: 0.25
  clip_cispo_high: 5.0
  clip_cispo_low: 0.0
  kl_coef: 0.01
  adv_eps: 0.0001
  dg_eta: 1.0
  entropy_chunk_size: 64
  entropy_grad: false
  adaptive_sampling: true
  oversample_factor: 2.0
  min_reward_spread: 0.5
  use_adaptive_lr: false
  kl_target: 0.05
  kl_factor: 1.5
  kl_ema: 0.2
  lr_factor: 1.5
  min_lr: 1.0e-07
  max_lr: 2.0e-05
gradient_checkpointing: true
