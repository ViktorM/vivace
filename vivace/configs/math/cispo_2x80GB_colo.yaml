# CISPO math 1.5B colocated, 2× 80GB GPUs (A100 / H100 / H200) — DDP.
# Step 2 of the 1/2/4/8 GPU scaling study. Per-rank work identical to
# math/cispo_1x80GB_colo.yaml: bs=4, gs=8, accum=2 → 64 traj per rank per
# optimizer step. Global = 2 × 64 = 128 trajectories/step.
#
# Compare against math/cispo_2x80GB.yaml (disaggregated, same 128 traj/step):
# this config splits trainer+vLLM colocated on each rank and DDPs the
# gradient across ranks, vs the disaggregated split (trainer GPU 0,
# vLLM GPU 1). Same global batch, different communication pattern.
#
# Launch with: torchrun --nproc_per_node=2 -m vivace.scripts.train ...
model_name: Qwen/Qwen2.5-1.5B
env_name: math
eval_envs:
- gsm8k
- math500
algo_name: cispo
mode: colocated
trainer_gpus:
- 0
- 1
rollout_gpus:
- 0
- 1
use_vllm: true
gpu_memory_utilization: 0.7   # vLLM sleeps during the train phase (enable_sleep_mode), so rollout can take most of the GPU
enforce_eager: false
compile_model: false
vllm_max_model_len: 1280
vllm_max_num_seqs: 256   # Qwen2.5 KV is small; 128 (Qwen3.5-era cap) throttled eval + rollout concurrency
use_lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
num_steps: 200
sft_warmup: false
sft_warmup_steps: 0
wandb_project: vivace
log_interval: 1
eval_interval: 50
eval_n: -1
eval_batch_size: 128
eval_use_vllm: true
max_prompt_tokens: 512
checkpoint_interval: 100
run_dir: runs/cispo_math_qw25_1.5b_lora_vllm_2x80GB_colo
weight_sync_method: ipc
seed: 42
rl:
  loss_type: cispo
  adv_type: rloo
  batch_size: 4
  group_size: 8
  lr: 2.0e-05
  warmup_steps: 10
  grad_accum_steps: 2
  optim_epochs: 2
  eta_min_ratio: 0.2
  lr_restart: false
  grad_clip: 1.0
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.95
  top_k: -1
  clip_low: 0.2
  clip_high: 0.2
  clip_ratio: 0.25
  clip_cispo_high: 5.0
  clip_cispo_low: 0.0
  cispo_use_token_mask: false
  cispo_normalization: hybrid
  kl_coef: 0.01
  adv_eps: 0.0001
  dg_eta: 1.0
  entropy_chunk_size: 64
  entropy_grad: false
  adaptive_sampling: true
  oversample_factor: 2.0
  min_reward_spread: 0.5
  use_adaptive_lr: false
  kl_target: 0.05
  kl_factor: 1.5
  kl_ema: 0.2
  lr_factor: 1.5
  min_lr: 1.0e-07
  max_lr: 2.0e-05
gradient_checkpointing: false
