model_name: Qwen/Qwen2.5-0.5B-Instruct
env_name: math
eval_envs: [math500]
algo_name: dapo
mode: colocated
trainer_gpus: [0, 1]
rollout_gpus: [0, 1]
use_vllm: true
gpu_memory_utilization: 0.3
enforce_eager: false
compile_model: false      # torch.compile; can interact badly with peft/DDP/variable-T
gradient_checkpointing: true  # required to fit max_new=512 in colo with vLLM sharing GPU
vllm_max_model_len: 1536  # MATH responses are longer than GSM8K's; prompt + 512 response fits in 1536
vllm_max_num_seqs: 32
use_lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
num_steps: 200
sft_warmup: false
sft_warmup_steps: 0
wandb_project: vivace
log_interval: 1
eval_interval: 50
eval_n: -1                # full MATH-500
eval_batch_size: 32
eval_use_vllm: true
# Drops the worst ~1% of MATH training prompts (LaTeX-heavy Olympiad problems);
# bounds the forward-pass memory worst case. Most are unsolvable for 0.5B anyway.
max_prompt_tokens: 512
checkpoint_interval: 100
run_dir: runs/dapo_math_qw25_0.5b_lora_colo_ddp
weight_sync_method: ipc
seed: 42
rl:
  loss_type: dapo
  adv_type: rloo
  batch_size: 1
  group_size: 6
  lr: 6.0e-05
  warmup_steps: 10
  grad_accum_steps: 4
  optim_epochs: 2
  eta_min_ratio: 0.2
  lr_restart: false
  grad_clip: 1.0
  max_new_tokens: 512     # gc enabled so we can afford the larger budget; fallback to 320 if colo OOMs
  temperature: 0.7
  top_p: 0.95
  top_k: -1
  clip_low: 0.2
  clip_high: 0.2
  clip_ratio: 0.25
  clip_cispo_high: 5.0
  kl_coef: 0.01
  adv_eps: 0.0001
  dg_eta: 1.0
  entropy_chunk_size: 64
  entropy_grad: false
  adaptive_sampling: true
  oversample_factor: 2.0
  min_reward_spread: 0.5
  use_adaptive_lr: false
  kl_target: 0.05
  kl_factor: 1.5
  kl_ema: 0.2
  lr_factor: 1.5
  min_lr: 1.0e-07
  max_lr: 2.0e-05
