model_name: Qwen/Qwen2.5-1.5B
env_name: math
eval_envs: [math500]
algo_name: dapo
# Disaggregated: trainer on GPU 0, vLLM on GPU 1. Frees the trainer from
# colo memory contention — comfortable 512 max_new_tokens at 1.5B.
mode: disaggregated
trainer_gpus: [0]
rollout_gpus: [1]
use_vllm: true
gpu_memory_utilization: 0.8       # vLLM has GPU 1 to itself in disaggregated
enforce_eager: false
compile_model: false
vllm_max_model_len: 1280          # max_prompt_tokens (512) + 512 response budget + 256 margin; max_new is 320 here
vllm_max_num_seqs: 32
use_lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
num_steps: 200
sft_warmup: false
sft_warmup_steps: 0
wandb_project: vivace
log_interval: 1
eval_interval: 50
eval_n: -1                        # full MATH-500
eval_batch_size: 32
eval_use_vllm: true
# Same long-tail filter as the colo config; Olympiad prompts are unsolvable
# at 1.5B too and only inflate the trainer's worst-case forward.
max_prompt_tokens: 512
checkpoint_interval: 100
run_dir: runs/dapo_math_1.5b_disagg_E4_base_model
weight_sync_method: nccl          # disaggregated default; LoRA NCCL via merge-broadcast-unmerge
seed: 42
rl:
  # Match the 0.5B colo config so the comparison isolates {model size + max_new_tokens + topology}.
  loss_type: dapo
  adv_type: rloo
  batch_size: 1
  group_size: 6
  lr: 2.0e-05                     # lower LR for 1.5B (existing 1.5B GSM8K config uses this)
  warmup_steps: 10
  grad_accum_steps: 8
  optim_epochs: 2
  eta_min_ratio: 0.2
  lr_restart: false
  grad_clip: 1.0
  max_new_tokens: 320             # 1.11× the colo run's 288 — point of this experiment
  temperature: 0.7
  top_p: 0.95
  top_k: -1
  clip_low: 0.2
  clip_high: 0.2
  clip_ratio: 0.25
  clip_cispo_high: 5.0
  kl_coef: 0.01                   # DAPO works best at low KL per project results
  adv_eps: 0.0001
  dg_eta: 1.0
  entropy_chunk_size: 64
  entropy_grad: false
  adaptive_sampling: true
  oversample_factor: 2.0
  min_reward_spread: 0.5
  use_adaptive_lr: false
  kl_target: 0.05
  kl_factor: 1.5
  kl_ema: 0.2
  lr_factor: 1.5
  min_lr: 1.0e-07
  max_lr: 2.0e-05
