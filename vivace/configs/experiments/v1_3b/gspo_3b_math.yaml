# v1 benchmark, 3B / math — GSPO (cluster preview + AIME generalization).
# Train on Hendrycks MATH (max_new=768, max_prompt=512). Eval on gsm8k + math500
# + AIME 24/25/26. AIME eval at 4096 via per-env eval_max_new_tokens; the vLLM
# engine is sized (vllm_max_model_len=4608) to fit prompt(512) + AIME gen(4096).
# gsm8k eval at 1024, not 256: Math-trained models write long solutions and 33-62%
# of responses were capped before the answer at 256 (v1_results.md, Math finding 3).
model_name: Qwen/Qwen2.5-3B
env_name: math
env_kwargs:
  corpus: hendrycks
algo_name: gspo
mode: colocated
trainer_gpus: [0, 1]
rollout_gpus: [0, 1]
use_vllm: true
# vLLM sleeps (weights + KV released) during the train phase, so the trainer gets
# the whole card for the 1280-token backward.
gpu_memory_utilization: 0.42   # 3B weights (5.8GB) sit in both the trainer and vLLM while awake; 0.5 OOMed at wake_up on the GPU that also holds the ~4GB desktop session
enforce_eager: false
compile_model: false
vllm_max_model_len: 4608
vllm_max_num_seqs: 24    # ctx 4608 -> ~166MB KV per seq at 3B; 24 fits the 0.42 pool
use_lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
num_steps: 200
sft_warmup: false
sft_warmup_steps: 0
wandb_project: vivace
log_interval: 1
eval_interval: 50
eval_n: -1
eval_batch_size: 8
eval_use_vllm: true
max_prompt_tokens: 512
checkpoint_interval: 200
run_dir: runs/v1_3b/gspo_3b_math
weight_sync_method: ipc
seed: 42
eval_envs: [gsm8k, math500, aime24, aime25, aime26]
eval_max_new_tokens: [1024, 1024, 4096, 4096, 4096]
rl:
  loss_type: gspo
  adv_type: rloo
  batch_size: 1
  group_size: 8
  lr: 4.0e-05
  warmup_steps: 10
  grad_accum_steps: 4
  optim_epochs: 2
  eta_min_ratio: 0.2
  lr_restart: false
  grad_clip: 1.0
  max_new_tokens: 768
  temperature: 0.7
  top_p: 0.95
  top_k: -1
  kl_coef: 0.01
  adv_eps: 0.0001
  entropy_chunk_size: 64
  entropy_grad: false
  adaptive_sampling: true
  oversample_factor: 2.0
  min_reward_spread: 0.5
  clip_low: 0.2
  clip_high: 0.2
gradient_checkpointing: true
