[project]
name = "vivace"
version = "0.0.3"
description = "A fast, hackable RL post-training lab for language models."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Viktor Makoviichuk" }]
license = { text = "MIT" }

dependencies = [
    "torch>=2.13",             # vllm 0.28 pins torch 2.13.0; cu130 wheels via [tool.uv.sources]
    "transformers>=4.58",      # 4.58+ adds qwen3_5; vllm 0.28 requires >=5.5.3 (locked 5.16.1)
    "datasets>=4.0",
    "accelerate>=1.13",
    "peft>=0.19",              # LoRA
    "vllm>=0.28",              # rollout inference; the PyPI wheel is a CUDA 13 build (links libcudart.so.13)
    "flash-attn>=2.8",         # trainer attn_implementation="flash_attention_2"; varlen kernels skip the O(S²) score tensor
    "wandb>=0.25",
    "pyyaml>=6.0",
    "numpy>=2.2",
    "tqdm>=4.67",
    "matplotlib>=3.10",
    "math-verify>=0.5",        # LaTeX-aware math answer verifier; backs MATHEnv / MATH500Env / AIME*Env rewards
    "fastokens>=0.2",          # Rust BPE tokenizer; enabled via VLLM_USE_FASTOKENS=1
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "ipython"]
# Qwen 3.5 models use DeltaNet layers — these provide fast CUDA kernels.
# Without them training works but is ~3-5x slower.
qwen35 = ["causal-conv1d", "flash-linear-attention"]
# OpenEnv and any other envs you want to keep optional
envs = ["openenv"]

[project.scripts]
vivace-train = "vivace.scripts.train:main"
vivace-sft = "vivace.scripts.sft:main"
vivace-eval = "vivace.scripts.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vivace"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

# Pin torch (and torchvision/torchaudio) to PyTorch's cu130 wheel channel.
# Default pypi serves cu12.8 wheels even for torch 2.11; without this index
# torch.version.cuda is "12.8", flash-attn's build refuses to compile against
# a cu13 base image, and the docker build fails.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

# flash-attn's setup.py imports torch at build time to detect CUDA version + GPU arches,
# but doesn't declare torch as a build dep. Inject it so uv sync can build the wheel.
[tool.uv.extra-build-dependencies]
# Pin to the locked torch: an unpinned build env resolves latest torch and
# compiles flash-attn against a mismatched C++ ABI (undefined c10 symbols).
flash-attn = ["torch==2.13.0"]
